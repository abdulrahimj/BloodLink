# Serves the built React SPA. try_files falls back to index.html for any path
# nginx doesn't have a file for, so a browser refresh never 404s even though
# this app doesn't currently use client-side routing — a safe default either way.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
