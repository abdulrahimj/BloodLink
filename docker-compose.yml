# ===========================================================================
#  DEMO ONLY. This file is not a production deployment.
#  It always runs the "demo" Spring profile against a container-only database
#  of fictional data, with the publicly known database password "root" below.
#  A real deployment runs the backend jar with its own database, a non-demo
#  profile and a real BLOODLINK_JWT_SECRET (see README, "Setting a real JWT
#  secret"); under any profile but default/demo the backend refuses to start
#  without one.
# ===========================================================================
#
# One-command startup for the whole BloodLink system: PostgreSQL, the Spring
# Boot backend, and the React frontend, wired together on one Docker network.
#
# Defaults to the "demo" Spring profile (see backend/Dockerfile and
# backend/src/main/resources/application-demo.properties) — `docker compose up`
# brings up a fully-populated demo (~850 donors, both blood banks stocked,
# sample requests/notifications) rather than an empty schema. It is pointed at
# its own "bloodlink_demo" database inside a container-only Postgres instance —
# entirely separate from the developer's local `bloodlink_dev`, which this file
# never references and cannot reach unless a developer manually points the "db"
# service's volume/port at that same local instance, which nothing here does.
#
# First time only: cp .env.example .env
#   Compose reads .env (gitignored) from this folder automatically. It supplies
#   BLOODLINK_JWT_SECRET — see .env.example for the format and how to generate a
#   real value. Compose refuses to start without it rather than falling back to
#   anything, so a secret is never silently missing.
#
# Usage: docker compose up --build   (first run, or after changing source)
#        docker compose up           (subsequent runs)
#        docker compose down         (stop; add -v to also delete the demo data volume)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bloodlink_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      # Named volume, not a bind mount to a host folder — the demo data lives
      # only inside Docker and is easy to wipe with `docker compose down -v`
      # for a fresh reseed, without touching anything on the host machine.
      - bloodlink_demo_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bloodlink_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Published for convenience (e.g. inspecting the demo data with a local
      # psql/pgAdmin); the backend itself reaches this service by its Docker
      # network hostname "db", not this host port.
      - "5433:5432"

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Demo only, deliberately fixed: the placeholder JWT secret is tolerated
      # under this profile, and under no non-demo one.
      SPRING_PROFILES_ACTIVE: demo
      # The image's JVM flags are sized for a 512 MB host (DEPLOYMENT.md); empty keeps the local demo as it was.
      JAVA_TOOL_OPTIONS: ""
      # Overrides application-demo.properties's localhost default to reach
      # Postgres by its Docker network hostname instead.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bloodlink_demo
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      # Must include the frontend's published host port (below), since that is
      # the Origin header a browser actually sends — not the frontend
      # container's internal Docker-network address.
      BLOODLINK_ALLOWED_ORIGINS: http://localhost:5173
      # The token-signing secret, passed explicitly from .env — never baked into
      # the image, and never read from a local file that only one machine has.
      # ":?" makes Compose stop with this message if it is unset or empty, instead
      # of starting the backend with no secret (which would fail far less clearly).
      # If .env still holds the public placeholder from .env.example, the backend
      # starts, because this is the "demo" profile, but prints a large warning
      # (Business Rule 15). Under any other profile that placeholder is refused,
      # and a secret under 32 bytes is refused under every profile.
      # A BLOODLINK_JWT_SECRET set in the shell outranks the one in .env.
      BLOODLINK_JWT_SECRET: "${BLOODLINK_JWT_SECRET:?BLOODLINK_JWT_SECRET is not set - copy .env.example to .env first, then see the notes inside it}"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        # Must be the backend's published *host* port — this value is baked
        # into the static JS bundle at build time and is read by the browser,
        # which knows nothing about the Docker-internal network.
        VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  bloodlink_demo_db:
