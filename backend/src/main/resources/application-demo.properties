# Activated with --spring.profiles.active=demo (or SPRING_PROFILES_ACTIVE=demo,
# which is how docker-compose.yml starts it by default).
#
# Two separate safeguards keep this profile from ever touching bloodlink_dev,
# not just one:
#
#   1. A different target database — bloodlink_demo, never bloodlink_dev. Set
#      here as a default, and overridable by the standard SPRING_DATASOURCE_URL
#      environment variable, which is exactly how docker-compose.yml points the
#      backend container at the "db" service instead of localhost.
#
#   2. spring.flyway.locations below adds a SECOND migration folder,
#      classpath:db/demo-seed, on top of the standard classpath:db/migration.
#      Only THIS profile's Flyway configuration ever looks in db/demo-seed —
#      the base application.properties (used by dev and by this same jar with
#      no profile active) lists only classpath:db/migration, so the demo seed
#      migrations are not merely unwanted there, they are structurally never
#      read. Even if someone pointed this profile's datasource at bloodlink_dev
#      by mistake, safeguard 1 would need to fail AND this one would still have
#      to be bypassed before any demo seed data could reach it.
#
# Every other setting (JWT secret, CORS origins, Hibernate ddl-auto=validate)
# is inherited unchanged from the base application.properties this file layers
# on top of.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bloodlink_demo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# db/demo-seed's migrations are numbered from V900 specifically so ordinary
# schema work continuing sequentially in db/migration (V9, V10, ...) can never
# collide with a demo-only version number — see V900's own header comment.
spring.flyway.locations=classpath:db/migration,classpath:db/demo-seed

# Hosted demo only (profiles demo,prod): two secrets replacing the published BloodLink@2026, required there and
# unset here, so the local demo is unchanged. HostedDemoPasswords applies them; see DEPLOYMENT.md, "Demo passwords".
bloodlink.demo.password=${BLOODLINK_DEMO_PASSWORD:}
bloodlink.demo.admin-password=${BLOODLINK_DEMO_ADMIN_PASSWORD:}
