spring.application.name=bloodlink

# --- Server ---
server.port=${SERVER_PORT:8080}

# --- Datasource (PostgreSQL, all values from the environment) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bloodlink}
spring.datasource.username=${DB_USERNAME:bloodlink}
spring.datasource.password=${DB_PASSWORD:bloodlink}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# Schema is managed by Flyway migrations in a later phase, never by ddl-auto.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
