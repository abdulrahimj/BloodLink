# The hosted profile (Render + Neon; see DEPLOYMENT.md). Committed on purpose: it holds no
# secret, only references to environment variables, and the ones without a default are required.
# Activated with SPRING_PROFILES_ACTIVE=prod, or demo,prod for the public demo site.

# Render sets PORT (10000 by default); SERVER_PORT or 8080 when it is absent.
server.port=${PORT:${SERVER_PORT:8080}}

# Neon's DIRECT (non-pooled) connection, as jdbc:postgresql://<host>/<db>?sslmode=require.
# Flyway needs a session lock that a pooled (PgBouncer) connection cannot hold.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Unset here means empty, which Business Rule 15 refuses, so the committed placeholder is never used.
bloodlink.jwt.secret=${BLOODLINK_JWT_SECRET:}

# The frontend's address (comma-separated if several), for CORS and the WebSocket alike.
bloodlink.cors.allowed-origins=${BLOODLINK_ALLOWED_ORIGINS}

# Sized for 512 MB and 0.1 CPU: few request threads, few database connections.
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
