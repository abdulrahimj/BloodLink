# Activated only by @ActiveProfiles("test") on the integration tests in
# com.bloodlink.integration (BloodRequestLifecycleIT, AdminAccountCreationIT,
# AccountSettingsIT, AdminEditAndAuditLogIT, DonorOptionalEmailIT).
#
# Overrides the datasource and the JWT secret (see the note at the bottom).
# Everything else — Flyway's migration path, Hibernate's ddl-auto=validate, token
# lifetime — is inherited from the main src/main/resources/application.properties,
# which this file layers on top of.
#
# bloodlink_test is a dedicated, persistent fixture database for this one
# integration test — never bloodlink_dev, and not the ad-hoc bloodlink_smoke
# databases created and dropped for manual verification elsewhere in this
# project. It is safe to run this test against repeatedly: the test class is
# @Transactional, so every row it writes is rolled back at the end of the
# method, and Flyway simply finds its migrations already applied on every run
# after the first. See BloodRequestLifecycleIT's own Javadoc for how to create
# this database the first time.
#
# WARNING: tests must only ever use bloodlink_test. An environment variable outranks
# this file, so a SPRING_DATASOURCE_URL left set in the terminal would silently point
# the tests somewhere else, bloodlink_dev included. IntegrationDatabaseGuard (registered
# in src/test/resources/META-INF/spring.factories) refuses to start under this profile
# unless the database is bloodlink_test (or PartialFulfilmentRaceIT's own throwaway).
spring.datasource.url=jdbc:postgresql://localhost:5432/bloodlink_test
spring.datasource.username=postgres
spring.datasource.password=root

# A secret of this profile's own, so the integration tests never run on the public
# placeholder (Business Rule 15). "test" is deliberately not one of the profiles
# allowed to use the placeholder: it only ever exists here, in src/test/resources,
# which is never packaged into the jar — so the profile name alone, activated by
# mistake on a real server, must not be enough to switch the check off. Committed
# and therefore public, which is fine: it signs tokens for a throwaway test
# database that rolls back everything it writes, and no deployment can ever load it.
bloodlink.jwt.secret=integration-tests-only-secret-never-used-outside-src-test-resources
